<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inam Vitran Hajari 2026 · Naroda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --card:#FFFFFF; --ink:#18203F; --muted:#5E6785; --line:#D9DEEC;
  --navy:#1C2554; --navy2:#27316B; --gold:#F2B21B; --onnavy:#FFFFFF;
  --balak:#2A56C6; --mata:#C4306A; --pita:#16804A; --inam:#DB5E14;
  --soft-b:#E6EDFC; --soft-m:#FBE7EF; --soft-p:#E2F4EA; --soft-i:#FDEBDD;
  --ok:#16804A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1426; --card:#181F38; --ink:#E9ECF7; --muted:#9AA3C2; --line:#2A3356;
  --navy:#141B3D; --navy2:#222B5A; --gold:#F5BD3A; --onnavy:#FFFFFF;
  --balak:#7C9EF5; --mata:#F07AA6; --pita:#4CC586; --inam:#F59A5B;
  --soft-b:#1E2A55; --soft-m:#3A1C2C; --soft-p:#153526; --soft-i:#3A2517; --ok:#4CC586;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1426; --card:#181F38; --ink:#E9ECF7; --muted:#9AA3C2; --line:#2A3356;
  --navy:#141B3D; --navy2:#222B5A; --gold:#F5BD3A; --onnavy:#FFFFFF;
  --balak:#7C9EF5; --mata:#F07AA6; --pita:#4CC586; --inam:#F59A5B;
  --soft-b:#1E2A55; --soft-m:#3A1C2C; --soft-p:#153526; --soft-i:#3A2517; --ok:#4CC586;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{background:var(--navy);color:var(--onnavy);padding:14px 16px 0;border-bottom:4px solid var(--gold)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:760px;margin:0 auto}
.org{font-size:13px;color:var(--gold);font-weight:600}
h1{font-size:20px;margin:2px 0 0;font-weight:700;line-height:1.2}
.live{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#8a8fa8}
.dot.on{background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.hall{text-align:right}
.hall b{display:block;font-size:44px;line-height:1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.hall span{font-size:12px;opacity:.85}
.stats{display:flex;gap:18px;max-width:760px;margin:12px auto 0;padding-bottom:12px;font-size:13px;overflow-x:auto}
.stats div{white-space:nowrap}
.stats strong{font-size:17px;margin-right:4px;font-variant-numeric:tabular-nums}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.controls>*{max-width:760px;margin-left:auto;margin-right:auto}
.search{display:flex;flex-direction:column;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
.seg button{flex:1;border:0;background:none;padding:7px 8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--onnavy)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap;color:var(--ink)}
.chip.on{border-color:var(--navy2);background:var(--navy2);color:var(--onnavy)}
.chip small{opacity:.7;margin-left:4px}

main{max-width:760px;margin:0 auto;padding:8px 12px 110px}
.grp{font-size:13px;font-weight:700;color:var(--muted);margin:14px 4px 6px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row.here{border-left:5px solid var(--ok)}
.sr{font-weight:700;color:var(--balak);min-width:52px;font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0}
.who .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;align-items:center;flex-shrink:0}
.t{font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px}
.t.b{background:var(--soft-b);color:var(--balak)}.t.m{background:var(--soft-m);color:var(--mata)}.t.p{background:var(--soft-p);color:var(--pita)}.t.i{background:var(--soft-i);color:var(--inam)}
.cnt{min-width:34px;height:34px;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.gbtn{border:2px solid var(--inam);background:transparent;color:var(--inam);border-radius:10px;padding:6px 12px;font-weight:700;min-width:88px}
.gbtn.done{background:var(--inam);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 12px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-weight:600;font-size:15px;color:var(--muted);border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--gold)}

.scrim{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility .22s}
.open .scrim{display:block}.open .sheet{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sh-sr{color:var(--balak);font-weight:700}
.sh-n{font-size:21px;font-weight:700;line-height:1.25;margin:2px 0}
.sh-s{color:var(--muted);font-size:14px}
.tog{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 10px}
.tg{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;font-weight:700;font-size:17px}
.tg[data-k=b].on{background:var(--balak);border-color:var(--balak);color:#fff}
.tg[data-k=m].on{background:var(--mata);border-color:var(--mata);color:#fff}
.tg[data-k=p].on{background:var(--pita);border-color:var(--pita);color:#fff}
.tg small{display:block;font-size:12px;font-weight:500;opacity:.8}
.oth{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px}
.oth .l{font-weight:600}.oth .l small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;border:0;background:var(--soft-b);color:var(--balak);font-size:24px;font-weight:700}
.step b{min-width:28px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px}
.total b{font-size:34px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px}
.primary{flex:1;border:0;background:var(--navy);color:var(--onnavy);border-radius:14px;padding:14px;font-weight:700;font-size:17px}
.ghost{border:2px solid var(--line);background:none;border-radius:14px;padding:12px 14px;font-weight:600;color:var(--muted)}
.giftline{margin-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}

.rep h2{font-size:17px;margin:18px 4px 8px}
.tblw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.sum td{font-weight:700;border-bottom:0}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rep .seg{display:flex}
table.det td,table.det th{padding:7px 8px}
.big div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.big b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.big span{font-size:13px;color:var(--muted)}
.exp{width:100%;margin-top:16px}
.note{font-size:13px;color:var(--muted);margin:10px 4px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw;text-align:center}

.me{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:var(--onnavy);border-radius:999px;padding:3px 12px;font-size:13px}
.addg{width:100%;border:2px dashed var(--line);background:none;border-radius:12px;padding:10px;font-weight:700;color:var(--muted);margin-top:8px}
.gname{font-size:12px;color:var(--inam);font-weight:600}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.set h2{font-size:17px;margin:20px 4px 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.grow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow label{min-width:92px;font-weight:600;font-size:14px}
.grow input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.vol{border-bottom:1px solid var(--line);padding:10px 0}
.vol:last-child{border-bottom:0}
.volh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.volh b{font-size:16px}
.vol .chips{flex-wrap:wrap;overflow:visible}
.del{border:0;background:none;color:var(--mata);font-weight:600;font-size:14px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inline button{border:0;background:var(--navy);color:var(--onnavy);border-radius:10px;padding:0 16px;font-weight:700}
.row.guest .sr{color:var(--inam)}
.stk{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--inam);border-radius:12px;padding:12px;margin-top:10px}
.stk.out{border-left-color:var(--mata)}
.stk-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stk-h b{font-size:17px}.stk-h span{font-size:13px;color:var(--muted)}
.stk-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.stk-g b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stk-g span{font-size:11px;color:var(--muted)}
.stk-w{margin-top:8px;font-size:13px;color:var(--mata);font-weight:600}
.al{margin-bottom:10px}.al .fld{margin:6px 0}
.al-r{display:flex;gap:8px}.al-r .fld{flex:1;min-width:0}
.al-s{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted);margin-top:6px}
.al-s .del{margin-left:auto}
#login{position:fixed;inset:0;z-index:50;background:var(--navy);display:none;align-items:center;justify-content:center;padding:24px}
#login .card{background:var(--card);color:var(--ink);border-radius:18px;padding:22px;width:100%;max-width:380px;border-top:5px solid var(--gold)}
#login h2{margin:0 0 2px;font-size:22px}
#lgErr{color:var(--mata);font-size:14px;min-height:20px;margin-top:6px}
.warn{background:#FFF4D6;color:#6B4B00;border:1px solid #F2D27A;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px auto 0;max-width:760px;display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="org">SMVS · Naroda</div>
      <h1>ઇનામ વિતરણ ૨૦૨૬<br>હાજરી</h1>
      <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">Connecting…</span></div>
      <button class="me" id="meBtn">👤 <span id="meTxt">તમારું નામ પસંદ કરો</span></button>
    </div>
    <div class="hall"><b id="hHall">0</b><span>સભામાં કુલ લોકો</span></div>
  </div>
  <div class="stats">
    <div><strong id="hStu">0</strong>/ <span id="hTot">482</span> વિદ્યાર્થી</div>
    <div><strong id="hFam">0</strong>વાલી + અન્ય</div>
    <div><strong id="hGuest">0</strong>મહેમાન</div>
    <div><strong id="hGift">0</strong>ઇનામ આપ્યા</div>
  </div>
</header>
<div class="warn" id="warn"></div>

<div class="controls" id="controls">
  <div class="search">
    <input id="q" type="search" inputmode="search" placeholder="SR NO કે નામ શોધો" autocomplete="off">
    <div class="seg" id="seg">
      <button data-g="A" class="on">બધા</button><button data-g="B">બાળક</button><button data-g="G">બાલિકા</button><button data-g="X">મહેમાન</button>
    </div>
  </div>
  <div class="chips" id="stds"></div>
  <div class="chips" id="filt"></div>
</div>

<main id="main"></main>

<nav id="nav">
  <button data-v="entry" class="on">પ્રવેશ</button>
  <button data-v="gift">ઇનામ</button>
  <button data-v="report">રિપોર્ટ</button>
  <button data-v="set">સેટિંગ</button>
</nav>

<div id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shN">
    <div class="sh-sr" id="shSr"></div>
    <div class="sh-n" id="shN"></div>
    <div class="sh-s" id="shS"></div>
    <div class="gname" id="shGn"></div>
    <div class="tog">
      <button class="tg" data-k="b">બાળક<small>Student</small></button>
      <button class="tg" data-k="m">માતા<small>Mother</small></button>
      <button class="tg" data-k="p">પિતા<small>Father</small></button>
    </div>
    <div class="oth">
      <div class="l">અન્ય સભ્યો<small>Brother, sister, others</small></div>
      <div class="step"><button id="xm" aria-label="Remove one">−</button><b id="xv">0</b><button id="xp" aria-label="Add one">+</button></div>
    </div>
    <div class="total"><span>કુલ આવ્યા</span><b id="shT">1</b></div>
    <div class="acts">
      <button class="ghost" id="shClear">Clear</button>
      <button class="primary" id="shSave">Save arrival</button>
    </div>
    <div class="giftline" id="shGift"></div>
  </div>
</div>

<div id="gsWrap">
  <div class="scrim" id="gscrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gsT">
    <div class="sh-n" id="gsT">મહેમાન ઉમેરો</div>
    <div class="sh-s">Guests who are not in the student list</div>
    <label class="fld"><span>નામ</span><input id="gsName" autocomplete="off" placeholder="e.g. Rameshbhai Patel"></label>
    <label class="fld"><span>મંડળ / સંદર્ભ (optional)</span><input id="gsRef" autocomplete="off" placeholder="Mandal, or whose relative"></label>
    <div class="oth">
      <div class="l">કેટલા લોકો<small>Including this person</small></div>
      <div class="step"><button id="gsm" aria-label="Remove one">−</button><b id="gsn">1</b><button id="gsp" aria-label="Add one">+</button></div>
    </div>
    <div class="acts" style="margin-top:16px">
      <button class="ghost" id="gsDel">Delete</button>
      <button class="primary" id="gsSave">Save guest</button>
    </div>
  </div>
</div>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="lgT"><div class="card">
  <div class="org" style="color:var(--inam)">SMVS · Naroda</div>
  <h2 id="lgT">ઇનામ વિતરણ ૨૦૨૬ Login</h2>
  <label class="fld"><span>Login ID</span><input id="lgId" autocapitalize="none" autocomplete="username"></label>
  <label class="fld"><span>Password</span><input id="lgPw" type="password" autocomplete="current-password"></label>
  <div id="lgErr"></div>
  <button class="primary" id="lgGo" style="width:100%">Login</button>
</div></div>
<div class="toast" id="toast"></div>

/* ---------- writes: one at a time per document ---------- */
const chains = {};
function put(path, rec){
  if(!db) return;
  const once = () => rec===null ? db.doc(path).delete() : db.doc(path).set(rec);
  const run = () => once().catch(e=>{
    if(e && e.code==="unavailable") return new Promise(r=>setTimeout(r,400+Math.random()*600)).then(once);
    throw e;
  }).catch(e=>{
    if(e && (e.code==="permission-denied" || e.code==="invalid-argument")){
      if(path.startsWith("cfg/")) toast("Only Admin IDs can change settings");
      else showWarn("તમારી પાસે edit access નથી.");
    } else if(e && e.code==="resource-exhausted") toast("Storage full, cannot add more");
    else toast("Save failed, try again");
  });
  chains[path] = (chains[path]||Promise.resolve()).then(run, run);
}
function writeAtt(id, rec){ att[id]=rec; render(); put("att/"+id, rec); }
function writeCfg(){ put("cfg/main", {allocs:allocs()}); }

  return {stu, ppl, gift, fam: ppl-stu, n:list.length};
}

function downloadCsv(filename, data){
  try{
    const blob = new Blob([data], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ toast("Download not available right now"); }
}
async function exportCsv(list, withGuests, filename){
  const t=v=>v?new Date(v).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}):"";
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;

  for(const s of list){ const r=att[s.id]||{}, h=here(r);
    lines.push([s.g==="B"?"Balak":"Balika",s.std,s.sr,s.name,s.mandal,h?"Present":"Absent",r.b?1:0,r.m?1:0,r.p?1:0,r.x||0,people(r),rankOf(s)?rLabel(rankOf(s).r):"",giftOf(s),volOf(s),r.gift?"Yes":"No",r.gift?r.gb||"":"",h?t(r.at):"",h?r.by||"":"",r.gift?t(r.gt):""].map(q).join(",")); }
  if(withGuests) for(const g of guestList().reverse())
    lines.push(["Guest","","",g.name,g.ref||"","Present","","","","",g.n||0,"","","","","",t(g.at),g.by||"",""].map(q).join(","));
  downloadCsv(filename, "\ufeff"+lines.join("\r\n"));
}

/* ---------- boot ---------- */
$("lgGo").onclick=doLogin; $("lgPw").onkeydown=e=>{ if(e.key==="Enter") doLogin(); }; $("lgId").onkeydown=e=>{ if(e.key==="Enter") $("lgPw").focus(); };
applyRole();
render();
(()=>{
  try{
    if(!window.firebase || firebaseConfig.apiKey==="YOUR_API_KEY") throw new Error("not configured");
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db=null; }
  if(!db){ usersReady=true; applyRole(); render(); $("liveTxt").textContent="Offline: this phone only"; showWarn("Live sharing is off. Add your Firebase config in index.html so all phones stay in sync (see README.md)."); return; }
  const lost=()=>{ $("dot").classList.remove("on"); $("liveTxt").textContent="Connection lost, reload page"; };
  const refresh=()=>{ $("dot").classList.add("on"); $("liveTxt").textContent="Live, synced across phones";
    if(cur || $("gsWrap").classList.contains("open")) renderHeader();
    else if(ui.view==="set" && document.activeElement && document.activeElement.matches("input")) renderHeader();
    else render(); };
  db.collection("att").limit(1000).onSnapshot(snap=>{ const n={}; snap.docs.forEach(d=>{ if(byId[d.id]) n[d.id]=d.data(); }); att=n; refresh(); }, lost);
  db.collection("guests").limit(1000).onSnapshot(snap=>{ const n={}; snap.docs.forEach(d=>{ n[d.id]=d.data(); }); guests=n; refresh(); }, lost);
  db.doc("cfg/users").onSnapshot(d=>{ usersReady=true; users = d.exists && Array.isArray(d.data().users) ? d.data().users : []; if(sessId && !U()){ sessId=null; try{ localStorage.removeItem("iv_uid"); }catch(e){} } applyRole(); refresh(); }, lost);
  db.doc("cfg/main").onSnapshot(d=>{ const v=d.exists?d.data():{allocs:DEFAULT_ALLOCS}; cfg={allocs:(Array.isArray(v.allocs)?v.allocs:[]).map(a=>{ const b=a.stds?a:{...a,stds:a.std?[a.std]:[]}; return b.id?b:{...b,id:"a_"+b.g+"_"+(b.stds||[]).join("_").replace(/\s/g,"")}; })}; refresh(); }, lost);
})();
</script>
